<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Algostonk KOL Chat</title>
  <link rel="stylesheet" href="https://alva-ai-static.b-cdn.net/design-system/v1/design-system.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@alva-ai/toolkit/dist/browser.global.js"></script>
  <style>
    :root {
      --app-accent: var(--main-m1);
      --app-text: var(--text-n9);
      --app-muted: var(--text-n5);
      --app-line: var(--line-l07);
      --app-soft: var(--grey-g01);
      --app-hover: var(--b-r03);
      --app-link: var(--main-m2);
      --rail-width: 232px;
      --intel-width: 296px;
    }
    * {
      box-sizing: border-box;
    }
    html {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      height: 100%;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--b0-page);
      color: var(--app-text);
      font-family: "Delight", "Noto Sans SC", "Noto Sans KR", "Noto Sans CJK SC", "Noto Sans CJK KR", "PingFang SC", "Microsoft YaHei", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, "OPPO Sans 4.0", BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    body.playbook-container {
      padding: 0;
    }
    button,
    textarea {
      font: inherit;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .app-frame {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      width: 100%;
      min-height: 100dvh;
      background: var(--b0-container);
    }

    /* ----- channel rail ----- */
    .rail {
      display: none;
      position: sticky;
      top: 0;
      align-self: start;
      max-height: 100dvh;
      overflow: hidden;
      padding: 16px 12px;
      background: var(--app-soft);
      border-right: 1px solid var(--app-line);
    }
    .rail-brand {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 0 6px;
      margin-bottom: 6px;
    }
    .rail-logo {
      display: inline-flex;
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: var(--main-m1);
      color: var(--b-common-white);
      font-size: 13px;
      line-height: 20px;
      font-weight: 500;
    }
    .rail-title {
      min-width: 0;
      font-size: 15px;
      line-height: 20px;
      font-weight: 500;
      color: var(--app-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rail-sub {
      margin: 2px 6px 10px;
      color: var(--app-muted);
      font-size: 12px;
      line-height: 17px;
    }
    .lang-row {
      display: inline-flex;
      gap: 4px;
      margin: 0 6px 14px;
    }
    .lang-button {
      min-width: 36px;
      min-height: 26px;
      padding: 0 8px;
      border: 1px solid var(--app-line);
      border-radius: 6px;
      background: var(--b0-container);
      color: var(--app-muted);
      font-size: 12px;
      line-height: 18px;
      cursor: pointer;
    }
    .lang-button:hover {
      border-color: var(--main-m1);
      color: var(--main-m1);
    }
    .lang-button.is-active {
      border-color: var(--main-m1);
      background: var(--main-m1-10);
      color: var(--main-m1);
      font-weight: 500;
    }
    .rail-label {
      margin: 0 6px 6px;
      color: var(--app-muted);
      font-size: 11px;
      line-height: 16px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .channel-list {
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .channel-list .channel-button.channel-button {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 32px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-n7);
      text-align: left;
      cursor: pointer;
    }
    .channel-list .channel-button.channel-button:hover {
      background: var(--app-hover);
      color: var(--app-text);
    }
    .channel-list .channel-button.channel-button.is-active {
      background: var(--main-m1-10);
      color: var(--main-m1);
    }
    .channel-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }
    .channel-count {
      color: var(--app-muted);
      font-size: 12px;
      line-height: 18px;
      font-variant-numeric: tabular-nums;
    }
    .channel-button.is-active .channel-count {
      color: var(--main-m1);
    }
    .rail-foot {
      margin: 16px 6px 0;
      padding-top: 12px;
      border-top: 1px solid var(--app-line);
      color: var(--app-muted);
      font-size: 12px;
      line-height: 17px;
    }
    .rail-foot a {
      color: var(--app-link);
    }
    .rail-foot a:hover {
      text-decoration: underline;
    }

    /* ----- mobile top header ----- */
    .mobile-head {
      position: sticky;
      top: 0;
      z-index: 6;
      display: grid;
      gap: 8px;
      padding: 10px 12px 8px;
      background: var(--b0-container);
      border-bottom: 1px solid var(--app-line);
    }
    .mobile-head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .mobile-title {
      min-width: 0;
      font-size: 16px;
      line-height: 22px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mobile-channels {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .mobile-channels::-webkit-scrollbar {
      display: none;
    }
    .mobile-channels .channel-button.channel-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: max-content;
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid var(--app-line);
      border-radius: 999px;
      background: var(--b0-container);
      color: var(--text-n7);
      font-size: 13px;
      line-height: 18px;
      cursor: pointer;
    }
    .mobile-channels .channel-button.channel-button.is-active {
      border-color: var(--main-m1);
      background: var(--main-m1-10);
      color: var(--main-m1);
      font-weight: 500;
    }

    /* ----- chat column ----- */
    .chat {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 100dvh;
      background: var(--b0-container);
    }
    .chat-topbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      min-height: 54px;
      padding: 8px 20px;
      border-bottom: 1px solid var(--app-line);
      background: var(--b0-container);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .channel-heading {
      display: grid;
      min-width: 0;
    }
    .channel-title {
      margin: 0;
      color: var(--app-text);
      font-size: 17px;
      line-height: 23px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .muted,
    .message-meta,
    .source-note {
      color: var(--app-muted);
      font-size: 12px;
      line-height: 18px;
    }
    .status-pill,
    .chat-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 21px;
      padding: 0 8px;
      border: 1px solid var(--line-l07);
      border-radius: 999px;
      background: var(--b0-container);
      color: var(--app-muted);
      font-size: 12px;
      line-height: 18px;
      white-space: nowrap;
    }
    .status-pill {
      border-color: var(--main-m1);
      color: var(--main-m1);
      background: var(--main-m1-10);
      font-weight: 500;
    }
    a.chat-pill:hover {
      border-color: var(--main-m1);
      color: var(--main-m1);
    }
    .bot-pill {
      border-color: var(--main-m1);
      background: var(--main-m1-10);
      color: var(--main-m1);
      font-weight: 500;
    }
    .message-list {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 14px 0 18px;
    }
    .date-divider {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      margin: 12px 20px;
      color: var(--app-muted);
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }
    .date-divider::before,
    .date-divider::after {
      content: "";
      height: 1px;
      background: var(--app-line);
    }
    .message {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      min-width: 0;
      padding: 7px 20px;
    }
    .message:hover {
      background: var(--app-hover);
    }
    .avatar {
      display: inline-flex;
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--grey-g5);
      color: var(--b-common-white);
      font-size: 13px;
      line-height: 20px;
      font-weight: 500;
    }
    .avatar.agent {
      background: var(--main-m1);
      padding: 0;
      overflow: hidden;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }
    .avatar.owner {
      background: var(--main-m3);
    }
    .message-main {
      display: grid;
      gap: 3px;
      min-width: 0;
    }
    .message-head {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .message-author {
      color: var(--app-text);
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      overflow-wrap: anywhere;
    }
    .message-title {
      color: var(--app-text);
      font-size: 15px;
      line-height: 21px;
      font-weight: 500;
      overflow-wrap: anywhere;
    }
    .message-body {
      color: var(--text-n7);
      font-size: 14px;
      line-height: 20px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .message-cred {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      color: var(--app-muted);
      font-size: 12px;
      line-height: 18px;
      overflow-wrap: anywhere;
    }
    .message-cred::before {
      content: "";
      flex: none;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--main-m1);
    }
    .message-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
    }
    .message-tags .message-meta {
      display: inline-flex;
      align-items: center;
      margin-left: 2px;
    }
    .handle-link {
      color: var(--app-link);
    }
    .handle-link:hover {
      text-decoration: underline;
    }
    .chat-pill .px {
      margin-left: 5px;
      font-variant-numeric: tabular-nums;
    }
    .px-up {
      color: var(--main-m3);
    }
    .px-down {
      color: var(--main-m4);
    }
    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
      padding: 10px 20px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--app-line);
      background: var(--b0-container);
      position: sticky;
      bottom: 0;
      z-index: 4;
    }
    .composer textarea {
      width: 100%;
      min-height: 42px;
      max-height: 140px;
      resize: none;
      border: 1px solid var(--line-l3);
      border-radius: 8px;
      background: var(--b0-container);
      color: var(--app-text);
      padding: 10px 12px;
      outline: none;
      font-size: 14px;
      line-height: 20px;
    }
    .composer textarea:focus {
      border-color: var(--main-m1);
      box-shadow: 0 0 0 1px var(--main-m1);
    }
    .composer button {
      min-width: 68px;
      min-height: 42px;
      border-radius: 8px;
      background: var(--main-m1);
      color: var(--b-common-white);
      font-weight: 500;
    }
    .composer.is-disabled {
      grid-template-columns: minmax(0, 1fr);
    }
    .composer.is-disabled button {
      display: none;
    }
    .composer #postButton {
      font-family: inherit;
    }
    .composer button:disabled,
    .composer textarea:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .composer-note {
      grid-column: 1 / -1;
      color: var(--app-muted);
      font-size: 12px;
      line-height: 18px;
      overflow-wrap: anywhere;
    }
    .composer-note.is-error {
      color: var(--main-m4);
    }

    /* ----- intel rail ----- */
    .intel {
      display: none;
      position: sticky;
      top: 0;
      align-self: start;
      max-height: 100dvh;
      overflow: hidden;
      padding: 16px 14px;
      border-left: 1px solid var(--app-line);
      background: var(--app-soft);
    }
    .intel .rail-label {
      margin: 0 0 8px;
    }
    .kol-list {
      display: grid;
      gap: 8px;
    }
    .ticker-card {
      display: grid;
      gap: 6px;
      padding: 10px;
      border: 1px solid var(--line-l07);
      border-radius: 8px;
      background: var(--b0-container);
    }
    .ticker-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .ticker-symbol {
      color: var(--app-text);
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ticker-reason {
      color: var(--text-n7);
      font-size: 13px;
      line-height: 18px;
      overflow-wrap: anywhere;
    }
    .intel .source-note {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--app-line);
    }
    .intel .source-note a {
      color: var(--app-link);
    }
    .empty-state {
      display: grid;
      place-items: center;
      min-height: 160px;
      margin: 14px 20px;
      border: 1px dashed var(--line-l12);
      border-radius: 8px;
      color: var(--app-muted);
      font-size: 14px;
      line-height: 20px;
      text-align: center;
      padding: 18px;
    }

    @media (min-width: 820px) {
      .app-frame {
        grid-template-columns: var(--rail-width) minmax(0, 1fr);
      }
      .rail {
        display: block;
      }
      .mobile-head {
        display: none;
      }
      .chat-topbar {
        display: flex;
      }
    }
    @media (min-width: 1180px) {
      .app-frame {
        grid-template-columns: var(--rail-width) minmax(0, 1fr) var(--intel-width);
      }
      .intel {
        display: block;
      }
    }
    @media (max-width: 819px) {
      .message {
        grid-template-columns: 32px minmax(0, 1fr);
        gap: 9px;
        padding: 6px 12px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 7px;
        font-size: 12px;
      }
      .date-divider {
        margin: 10px 12px;
      }
      .empty-state {
        margin: 12px 12px;
      }
      .composer {
        padding: 8px 10px max(10px, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body class="playbook-container">
  <div class="app-frame">
    <aside class="rail">
      <div class="rail-brand">
        <div class="rail-logo">AK</div>
        <div class="rail-title" id="brandTitle">Algostonk KOL Chat</div>
      </div>
      <div class="rail-sub" id="brandSub">Top FinTwit KOL posts, filtered by leaderboard track record.</div>
      <div class="lang-row" id="languageSwitch" aria-label="Language">
        <button class="btn btn-secondary btn-medium lang-button is-active" type="button" data-lang="en">EN</button>
        <button class="btn btn-secondary btn-medium lang-button" type="button" data-lang="cn">中文</button>
        <button class="btn btn-secondary btn-medium lang-button" type="button" data-lang="kr">한국어</button>
      </div>
      <p class="rail-label" id="channelsLabel">Channels</p>
      <nav class="channel-list" id="channelList" aria-label="Channels"></nav>
      <div class="rail-foot" id="sourceNote"></div>
    </aside>

    <main class="chat">
      <div class="mobile-head">
        <div class="mobile-head-row">
          <div class="mobile-title" id="mobileTitle">Algostonk KOL Chat</div>
          <div class="lang-row" id="languageSwitchMobile" aria-label="Language" style="margin: 0;">
            <button class="btn btn-secondary btn-medium lang-button is-active" type="button" data-lang="en">EN</button>
            <button class="btn btn-secondary btn-medium lang-button" type="button" data-lang="cn">中文</button>
            <button class="btn btn-secondary btn-medium lang-button" type="button" data-lang="kr">한국어</button>
          </div>
        </div>
        <nav class="mobile-channels" id="channelListMobile" aria-label="Channels"></nav>
      </div>

      <header class="chat-topbar">
        <div class="channel-heading">
          <h1 class="channel-title" id="activeChannelTitle">#market-wire</h1>
          <div class="muted" id="activeChannelDescription">Cross-asset KOL market tape</div>
        </div>
        <div class="status-pill" id="feedStatus">Loading</div>
      </header>

      <section class="message-list" id="messageList" aria-live="polite">
        <div class="empty-state">Loading channel history.</div>
      </section>

      <form class="composer" id="composer">
        <textarea id="messageInput" maxlength="600" placeholder="Message this channel"></textarea>
        <button class="btn btn-primary btn-medium" id="postButton" type="submit">Post</button>
        <div class="composer-note" id="composerNote" hidden></div>
      </form>
    </main>

    <aside class="intel">
      <p class="rail-label" id="contextLabel">Recent Tickers</p>
      <div class="kol-list" id="kolList"></div>
      <div class="source-note" id="intelSourceNote"></div>
    </aside>
  </div>

  <script>
    const OWNER = "snarketh";

        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    }
    function uiLocale() {
      return lang === "cn" ? "zh-CN" : lang === "kr" ? "ko-KR" : "en-US";
    }
    function fmtTime(ms) {
      const n = Number(ms);
      if (!Number.isFinite(n)) return "";
      return new Intl.DateTimeFormat(uiLocale(), {
        hour: "2-digit",
        minute: "2-digit",
      }).format(new Date(n));
    }
    function dayKey(ms) {
      const n = Number(ms);
      if (!Number.isFinite(n)) return "";
      const d = new Date(n);
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function dayLabel(ms) {
      const n = Number(ms);
      if (!Number.isFinite(n)) return "";
      return new Intl.DateTimeFormat(uiLocale(), {
        month: "short",
        day: "numeric",
      }).format(new Date(n));
    }
    function channelInfo(id) {
      return channels.find((item) => item.channel === id) || channels[0] || FALLBACK_CHANNELS[0];
    }
    function canPost() {
      return !!(window.alva && window.alva.udf && window.alva.udf.getViewerToken && window.alva.udf.getViewerToken());
    }
    function setStatus(text) {
      document.getElementById("feedStatus").textContent = text;
    }
    function sourceNoteHtml() {
      return esc(tr("sourceNotePrefix")) +
        ' <a href="' + esc(SOURCE_URL) + '" target="_blank" rel="noopener noreferrer">' + esc(tr("sourceNoteLink")) + "</a> " +
        esc(tr("sourceNoteSuffix"));
    }
    function renderStaticCopy() {
      document.documentElement.lang = tr("htmlLang");
      document.title = tr("title");
      document.getElementById("brandTitle").textContent = tr("title");
      document.getElementById("mobileTitle").textContent = tr("title");
      document.getElementById("brandSub").textContent = tr("brandSub");
      document.getElementById("channelsLabel").textContent = tr("channelsLabel");
      document.getElementById("contextLabel").textContent = tr("contextLabel");
      document.getElementById("postButton").textContent = tr("post");
      document.getElementById("channelList").setAttribute("aria-label", tr("channelsLabel"));
      document.getElementById("sourceNote").innerHTML = sourceNoteHtml();
      document.getElementById("intelSourceNote").innerHTML = sourceNoteHtml();
      document.querySelectorAll(".lang-button").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.lang === lang);
      });
    }
    function channelButtonHtml(item, counts) {
      return `
        <button class="btn btn-secondary btn-medium channel-button ${item.channel === activeChannel ? "is-active" : ""}" type="button" data-channel="${esc(item.channel)}">
          <span class="channel-name">#${esc(item.name || item.channel)}</span>
          <span class="channel-count">${esc(counts[item.channel] || 0)}</span>
        </button>
      `;
    }
    function renderChannels() {
      const counts = messages.reduce((acc, msg) => {
        if (!shouldRenderMessage(msg)) return acc;
        acc[msg.channel] = (acc[msg.channel] || 0) + 1;
        return acc;
      }, {});
      const visibleChannels = channels.length ? channels : FALLBACK_CHANNELS;
      const html = visibleChannels.map((item) => channelButtonHtml(item, counts)).join("");
      document.getElementById("channelList").innerHTML = html;
      document.getElementById("channelListMobile").innerHTML = html;
      document.querySelectorAll(".channel-button").forEach((button) => {
        button.addEventListener("click", () => {
          activeChannel = button.dataset.channel;
          renderAll();
          scrollToBottomSoon();
        });
      });
    }
    function displayAuthorName(msg) {
      if (msg.author_type === "agent") return AGENT_DISPLAY_NAME;
      const raw = String(msg.author_name || "viewer").replace(/^@/, "");
      if (msg.author_type === "owner" || raw.toLowerCase() === "snarketh") return OWNER_DISPLAY_NAME;
      return raw;
    }
    function avatarText(msg) {
      if (msg.author_type === "agent") return "AB";
      const name = displayAuthorName(msg);
      return (name.slice(0, 2) || "?").toUpperCase();
    }
    function localizedAgentDigest(msg, targetLang) {
      const headlineMap = parseJsonObject(msg.headline_i18n_json);
      const bodyMap = parseJsonObject(msg.body_i18n_json);
      const direct = {
        headline: headlineMap[targetLang] || "",
        body: bodyMap[targetLang] || "",
      };
      if (direct.headline || direct.body) return direct;

      const meta = parseJsonObject(msg.meta_json);
      const i18n = meta.i18n || {};
      const selected = i18n[targetLang] || {};
      return {
        headline: selected.headline || "",
        body: selected.body || "",
      };
    }
    function hasStructuredAgentCopy(msg) {
      const headlineMap = parseJsonObject(msg.headline_i18n_json);
      const bodyMap = parseJsonObject(msg.body_i18n_json);
      if (headlineMap.en || headlineMap.cn || headlineMap.kr || bodyMap.en || bodyMap.cn || bodyMap.kr) return true;
      const meta = parseJsonObject(msg.meta_json);
      return !!(meta.i18n && (meta.i18n.en || meta.i18n.cn || meta.i18n.kr));
    }
    function isTraceablePostUrl(url) {
      const value = String(url || "").toLowerCase();
      return value.includes("x.com/") || value.includes("twitter.com/");
    }
    function shouldRenderMessage(msg) {
      if (msg.author_type === "agent") {
        if (!hasStructuredAgentCopy(msg)) return false;
        if (!isTraceablePostUrl(firstMessageSourceUrl(msg))) return false;
      }
      if (msg.author_type !== "agent" || lang === "en") return true;
      const text = localizedAgentDigest(msg, lang);
      return !!(text.headline || text.body);
    }
    function localizedMessageText(msg) {
      if (msg.author_type !== "agent") {
        return { headline: msg.headline || "", body: msg.body || "" };
      }
      if (lang !== "en") return localizedAgentDigest(msg, lang);
      const selected = localizedAgentDigest(msg, "en");
      return {
        headline: selected.headline || msg.headline || "",
        body: selected.body || msg.body || "",
      };
    }
    function credibilityText(msg) {
      const meta = parseJsonObject(msg.meta_json);
      const cred = meta.credibility || {};
      return String(cred[lang] || cred.en || "").trim();
    }
    function firstMessageSourceUrl(msg) {
      const meta = parseJsonObject(msg.meta_json);
      const urls = Array.isArray(meta.source_urls) ? meta.source_urls : [];
      const fromMeta = urls.map((url) => String(url || "").trim()).find(Boolean);
      return fromMeta || String(msg.source_url || "").trim();
    }
    function stripSourceCta(text) {
      let value = String(text || "").replace(/\s+/g, " ").trim();
      const patterns = [
        /\s*(?:Read|Open|Click|See)\s+(?:his|her|their|the|this|that)?\s*(?:tracker|trackers|thread|source|context|post|link)[^.?!。]*[.?!。]?$/i,
        /\s*(?:点开|点击|打开|查看|看)(?:他|她|它|这条|该)?(?:的)?\s*(?:tracker|追踪页|原帖|原推|来源|上下文|链接)[^。.!?]*[。.!?]?$/i,
        /\s*(?:원문|소스|tracker|트래커|링크)[^.?!。]*(?:확인|보라|보세요)[^.?!。]*[.?!。]?$/i,
      ];
      let changed = true;
      while (changed) {
        changed = false;
        patterns.forEach((pattern) => {
          const next = value.replace(pattern, "").trim();
          if (next !== value) {
            value = next;
            changed = true;
          }
        });
      }
      return value;
    }
    function sourceHost(url) {
      try {
        return new URL(url).hostname.replace(/^www\./, "");
      } catch (_) {
        return "source";
      }
    }
    function linkifyHandles(text) {
      return String(text || "").split(/(@[A-Za-z0-9_]{1,30})/g).map((part) => {
        if (/^@[A-Za-z0-9_]{1,30}$/.test(part)) {
          return `<a class="handle-link" href="https://x.com/${esc(part.slice(1))}" target="_blank" rel="noopener noreferrer">${esc(part)}</a>`;
        }
        return esc(part);
      }).join("");
    }
    function fmtPx(value) {
      const n = Number(value);
      if (!Number.isFinite(n) || !n) return "";
      if (n >= 1000) return String(Math.round(n));
      if (n >= 100) return n.toFixed(1);
      if (n >= 1) return n.toFixed(2);
      return n.toPrecision(3);
    }
    function tickerPillHtml(ticker, prices) {
      const p = prices && prices[ticker];
      const px = p ? fmtPx(p.price) : "";
      if (!px) return `<span class="chat-pill">${esc(ticker)}</span>`;
      const cur = p.currency && p.currency !== "USD" ? " " + esc(p.currency) : "";
      const chg = Number(p.chg24h_pct);
      const hasChg = Number.isFinite(chg);
      const cls = hasChg ? (chg >= 0 ? "px-up" : "px-down") : "";
      const chgTxt = hasChg ? " " + (chg >= 0 ? "+" : "") + chg.toFixed(1) + "%" : "";
      return `<span class="chat-pill">${esc(ticker)}<span class="px ${cls}">${esc(px)}${cur}${chgTxt}</span></span>`;
    }
    function messageHtml(msg) {
      const isAgent = msg.author_type === "agent";
      const tags = parseJsonList(msg.tickers_json).slice(0, 8);
      const msgMeta = parseJsonObject(msg.meta_json);
      const tickerPrices = msgMeta.ticker_prices || {};
      const handles = isAgent ? [] : parseJsonList(msg.source_handles_json).slice(0, 5);
      const text = localizedMessageText(msg);
      const headlineText = isAgent ? stripSourceCta(text.headline) : text.headline;
      const bodyText = isAgent ? stripSourceCta(text.body) : text.body;
      const title = headlineText ? `<div class="message-title">${esc(headlineText)}</div>` : "";
      const cred = isAgent ? credibilityText(msg) : "";
      const credLine = cred ? `<div class="message-cred">${linkifyHandles(cred)}</div>` : "";
      const sourceUrl = isAgent ? firstMessageSourceUrl(msg) : String(msg.source_url || "").trim();
      const sourcePill = sourceUrl
        ? `<a class="chat-pill" href="${esc(sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(tr("sourceBadge"))} · ${esc(sourceHost(sourceUrl))} ↗</a>`
        : "";
      const timeMeta = `<span class="message-meta">${esc(fmtTime(msg.date))}</span>`;
      const head = isAgent ? "" : `
            <div class="message-head">
              <span class="message-author">${esc(displayAuthorName(msg))}</span>
              ${timeMeta}
            </div>`;
      const bottomRow = `
            <div class="message-tags">
              ${isAgent ? '<span class="chat-pill bot-pill">' + esc(tr("aiBadge")) + "</span>" : ""}
              ${tags.map((ticker) => tickerPillHtml(ticker, tickerPrices)).join("")}
              ${handles.map((handle) => `<a class="chat-pill" href="https://x.com/${esc(handle)}" target="_blank" rel="noopener noreferrer">@${esc(handle)}</a>`).join("")}
              ${sourcePill}
              ${isAgent ? timeMeta : ""}
            </div>`;
      return `
        <article class="message ${esc(msg.author_type || "viewer")}">
          <div class="avatar ${esc(msg.author_type || "viewer")}">${
            msg.author_type === "agent"
              ? `<img class="avatar-img" src="${AGENT_AVATAR_SRC}" alt="${esc(AGENT_DISPLAY_NAME)}" />`
              : esc(avatarText(msg))
          }</div>
          <div class="message-main">${head}
            ${title}
            <div class="message-body">${linkifyHandles(bodyText || "")}</div>
            ${credLine}
            ${bottomRow}
          </div>
        </article>
      `;
    }
    function renderMessages() {
      const list = messages
        .filter((msg) => msg.channel === activeChannel)
        .filter(shouldRenderMessage)
        .sort((a, b) => Number(a.date || 0) - Number(b.date || 0));
      const visible = list.slice(-MESSAGE_WINDOW);
      const el = document.getElementById("messageList");
      if (!visible.length) {
        el.innerHTML = `<div class="empty-state">${esc(tr("emptyChannel")(activeChannel))}</div>`;
        return;
      }
      let currentDay = "";
      el.innerHTML = visible.map((msg) => {
        const key = dayKey(msg.date);
        const divider = key && key !== currentDay ? `<div class="date-divider">${esc(dayLabel(msg.date))}</div>` : "";
        currentDay = key || currentDay;
        return divider + messageHtml(msg);
      }).join("");
    }
    function scrollerEl() {
      const body = document.body;
      const root = document.scrollingElement || document.documentElement;
      return body.scrollHeight > root.scrollHeight ? body : root;
    }
    function nearBottom() {
      const el = scrollerEl();
      return el.scrollHeight - el.scrollTop - el.clientHeight < 240;
    }
    function scrollToBottom() {
      const body = document.body;
      body.scrollTop = body.scrollHeight;
      const root = document.scrollingElement || document.documentElement;
      root.scrollTop = root.scrollHeight;
    }
    function scrollToBottomSoon() {
      requestAnimationFrame(() => {
        scrollToBottom();
        [80, 250, 600, 1200, 2000].forEach((delay) => setTimeout(() => {
          if (initialAnchorPending || nearBottom()) scrollToBottom();
        }, delay));
      });
    }
    function renderKols() {
      const newestDate = tickerContext.reduce((max, row) => Math.max(max, Number(row.date || 0)), 0);
      const batchFloor = newestDate ? newestDate - 30000 : 0;
      const batchRows = tickerContext.filter((row) => Number(row.date || 0) >= batchFloor);
      const byTicker = {};
      batchRows.forEach((row) => {
        const ticker = row.ticker || "";
        if (!ticker) return;
        if (!byTicker[ticker] || Number(row.date || 0) > Number(byTicker[ticker].date || 0)) byTicker[ticker] = row;
      });
      const top = Object.keys(byTicker)
        .map((key) => byTicker[key])
        .sort((a, b) => Number(b.mention_score || 0) - Number(a.mention_score || 0))
        .slice(0, 6);
      const el = document.getElementById("kolList");
      if (!top.length) {
        el.innerHTML = `<div class="empty-state" style="min-height: 100px; margin: 0;">${esc(tr("emptyContext"))}</div>`;
        return;
      }
      el.innerHTML = top.map((row) => {
        const handles = parseJsonList(row.source_handles_json).slice(0, 3);
        const urls = parseJsonList(row.source_urls_json).slice(0, 1);
        const basis = row.source_basis === "recent_posts" ? tr("recentPosts") : tr("leaderboard");
        const reason = row["reason_" + lang] || row.reason_en || "";
        const channel = row.channel ? "#" + row.channel : "";
        return `
          <article class="ticker-card">
            <div class="ticker-card-top">
              <div class="ticker-symbol">${esc(row.ticker)}</div>
              <span class="chat-pill">${esc(basis)}</span>
            </div>
            <div class="ticker-reason">${esc(reason)}</div>
            <div class="message-tags">
              ${channel ? `<span class="chat-pill">${esc(channel)}</span>` : ""}
              ${handles.map((handle) => `<a class="chat-pill" href="https://x.com/${esc(handle)}" target="_blank" rel="noopener noreferrer">@${esc(handle)}</a>`).join("")}
              ${urls.map((url) => `<a class="chat-pill" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(tr("sourceBadge"))} ↗</a>`).join("")}
            </div>
          </article>
        `;
      }).join("");
    }
    function renderHeader() {
      const info = channelInfo(activeChannel);
      document.getElementById("activeChannelTitle").textContent = "#" + (info.name || info.channel);
      document.getElementById("activeChannelDescription").textContent = channelDescription(activeChannel);
    }
    function renderComposer() {
      const form = document.getElementById("composer");
      const textarea = document.getElementById("messageInput");
      const button = document.getElementById("postButton");
      const signedIn = canPost();
      const enabled = signedIn && !posting;
      form.classList.toggle("is-disabled", !signedIn);
      textarea.disabled = !enabled;
      button.disabled = !enabled;
      textarea.placeholder = signedIn ? tr("messagePlaceholder")(activeChannel) : tr("signInPlaceholder");
    }
    function renderAll() {
      renderStaticCopy();
      renderHeader();
      renderChannels();
      renderMessages();
      renderKols();
      renderComposer();
    }
    async function loadAll(options) {
      const opts = options || {};
      const stick = opts.initial || nearBottom();
      try {
        const [channelRows, messageRows, kolRows] = await Promise.all([
          readAlfsJson(`${BASE}/config/channels/@last/20`).catch(() => []),
          readAlfsJson(`${BASE}/chat/messages/@last/220`).catch(() => []),
          readAlfsJson(`${BASE}/agent/tickers/@last/60`).catch(() => []),
        ]);
        const normalizedChannels = asRows(channelRows).map(normalizeChannel).filter(Boolean);
        if (normalizedChannels.length) {
          const latest = {};
          normalizedChannels.forEach((row) => { latest[row.channel] = row; });
          channels = Object.keys(latest).map((key) => latest[key]).sort((a, b) => {
            const order = FALLBACK_CHANNELS.map((c) => c.channel);
            return order.indexOf(a.channel) - order.indexOf(b.channel);
          });
        }
        const previousCount = messages.length;
        messages = asRows(messageRows);
        tickerContext = asRows(kolRows);
        if (!channels.some((item) => item.channel === activeChannel)) activeChannel = channels[0].channel;
        setStatus(messages.length ? tr("liveFeed") : tr("noMessages"));
        renderAll();
        if (stick && (opts.initial || messages.length !== previousCount)) scrollToBottomSoon();
      } catch (err) {
        setStatus(tr("loadError"));
        document.getElementById("messageList").innerHTML = `<div class="empty-state">${esc(err.message || err)}</div>`;
      }
    }
    function setComposerNote(text, isError) {
      const el = document.getElementById("composerNote");
      el.textContent = text || "";
      el.hidden = !text;
      el.classList.toggle("is-error", !!isError);
    }
    document.getElementById("composer").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!canPost() || posting) return;
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (!text) return;
      posting = true;
      renderComposer();
      setComposerNote(tr("sending"), false);
      try {
        let result = await window.alva.udf.call("post_message", { channel: activeChannel, text });
        if (typeof result === "string") {
          try { result = JSON.parse(result); } catch (_) {}
        }
        input.value = "";
        setComposerNote("", false);
        if (result && result.posted) {
          messages.push(result.posted);
          renderAll();
          scrollToBottomSoon();
        }
        await loadAll({ initial: true });
      } catch (err) {
        setComposerNote(tr("postFailed") + ": " + (err && err.message ? err.message : err), true);
      } finally {
        posting = false;
        renderComposer();
      }
    });
    document.getElementById("messageInput").addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;
      event.preventDefault();
      if (typeof event.target.form.requestSubmit === "function") {
        event.target.form.requestSubmit();
      } else {
        event.target.form.dispatchEvent(new Event("submit", { cancelable: true }));
      }
    });
    document.querySelectorAll(".lang-button").forEach((button) => {
      button.addEventListener("click", () => {
        lang = button.dataset.lang;
        try {
          localStorage.setItem("kolMarketChatLang", lang);
        } catch (_) {}
        renderAll();
      });
    });
    window.addEventListener("message", () => renderComposer());
    window.addEventListener("resize", () => renderAll());
    window.addEventListener("load", () => {
      if (initialAnchorPending) scrollToBottom();
    });
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(() => {
        if (initialAnchorPending) scrollToBottom();
      });
    }
    renderStaticCopy();
    document.getElementById("feedStatus").textContent = tr("loading");
    document.getElementById("messageList").innerHTML = `<div class="empty-state">${esc(tr("loadingHistory"))}</div>`;
    loadAll({ initial: true });
    setInterval(loadAll, 20000);
  </script>
</body>
</html>
