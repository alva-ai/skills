name: Publish design tokens to GCS

on:
  push:
    branches: [main]
    paths:
      - 'skills/alva/references/design-tokens.css'
      - 'skills/alva/references/design-contract.yaml'
      - 'skills/alva/references/css/design-system.css'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Guard against publishing a drifted bundle. The sync workflow
      # commits-back regen on PRs, but PRs can slip through (squash
      # race, admin merge) and leave main stale. Fail here rather
      # than serve drift from the CDN — fix via PR.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: skills/alva/scripts/pnpm-lock.yaml

      - name: Install scripts deps
        working-directory: skills/alva/scripts
        run: pnpm install --frozen-lockfile

      - name: Verify design-system.css is in sync with design docs
        working-directory: skills/alva/scripts
        run: pnpm design-contract-sync

      - name: GCP Auth
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCS_ALVA_AI_INTERNAL_ARTIFACTS_SA_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          version: '>= 363.0.0'

      - name: Upload design tokens to GCS
        uses: google-github-actions/upload-cloud-storage@v1
        with:
          path: skills/alva/references/design-tokens.css
          destination: alva-ai-stg-ssr-cdn-bucket/design-system/
          parent: false
          headers: |
            cache-control: public,max-age=3600

      - name: Upload design contract to GCS
        uses: google-github-actions/upload-cloud-storage@v1
        with:
          path: skills/alva/references/design-contract.yaml
          destination: alva-ai-stg-ssr-cdn-bucket/design-system/
          parent: false
          headers: |
            cache-control: public,max-age=3600

      - name: Upload v1 design-system bundle to GCS
        uses: google-github-actions/upload-cloud-storage@v1
        with:
          path: skills/alva/references/css/design-system.css
          destination: alva-ai-stg-ssr-cdn-bucket/design-system/v1/
          parent: false
          headers: |
            cache-control: public,max-age=3600
